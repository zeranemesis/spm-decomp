name: PC Port Tooling Smoke Tests

on:
  push:
    branches:
      - pc-port
      - "chatgpt/**"
    paths:
      - "pc-port/scripts/**"
      - "pc-port/tests/**"
      - "pc-port/*.ps1"
      - ".github/workflows/pc-port-tooling.yml"
  pull_request:
    branches:
      - pc-port
    paths:
      - "pc-port/scripts/**"
      - "pc-port/tests/**"
      - "pc-port/*.ps1"
      - ".github/workflows/pc-port-tooling.yml"
  workflow_dispatch:

jobs:
  tooling-smoke:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python tooling
        shell: pwsh
        run: python -m compileall -q pc-port/scripts pc-port/tests

      - name: Run synthetic DOL/REL tests
        shell: pwsh
        run: python -m unittest discover -s pc-port/tests -v

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $allErrors = @()
          Get-ChildItem -Path pc-port -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              Write-Host "Parse errors in $($_.FullName):"
              $errors | ForEach-Object { Write-Host "  $($_.Message)" }
              $allErrors += $errors
            }
          }

          if ($allErrors.Count -gt 0) {
            throw "PowerShell parsing failed with $($allErrors.Count) error(s)."
          }
